<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep sleek dark background with subtle Ok! Todo sky-blue ambient sheen -->
    <linearGradient id="bg-dark" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#1E2833"/>
      <stop offset="50%" stop-color="#141B23"/>
      <stop offset="100%" stop-color="#0E1319"/>
    </linearGradient>
    <radialGradient id="bg-blue-glow" cx="24%" cy="16%" r="72%">
      <stop offset="0%" stop-color="#39AFEA" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#39AFEA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39AFEA" stop-opacity="0"/>
    </radialGradient>

    <!-- Elevated dark slate card with luminous sky-blue top rim -->
    <linearGradient id="card-dark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#27313D"/>
      <stop offset="100%" stop-color="#1C232C"/>
    </linearGradient>
    <linearGradient id="card-rim" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4EC7FA" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#39AFEA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-12%" width="130%" height="134%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <linearGradient id="badge-green" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#7BE597"/>
      <stop offset="100%" stop-color="#46CF73"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6FE390"/>
      <stop offset="100%" stop-color="#90ECA9"/>
    </linearGradient>

    <linearGradient id="badge-yellow" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F2D56C"/>
      <stop offset="100%" stop-color="#DFB53C"/>
    </linearGradient>
    <linearGradient id="bar-yellow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E6C760"/>
      <stop offset="100%" stop-color="#F2DA82"/>
    </linearGradient>

    <linearGradient id="badge-coral" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F6808A"/>
      <stop offset="100%" stop-color="#E45764"/>
    </linearGradient>
    <linearGradient id="bar-coral" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E65D69"/>
      <stop offset="100%" stop-color="#F4838D"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg-dark)"/>
  <rect width="1024" height="1024" fill="url(#bg-blue-glow)"/>

  <g filter="url(#card-shadow)">
    <rect x="166" y="152" width="692" height="720" rx="126" fill="url(#card-dark)"/>
    <rect x="168" y="154" width="688" height="716" rx="124" fill="none" stroke="url(#card-rim)" stroke-width="5"/>
  </g>

  <!-- Row 1: Aujourd'hui -->
  <g>
    <circle cx="304" cy="332" r="58" fill="url(#badge-green)"/>
    <path d="M277 334 L296 353 L334 313" fill="none" stroke="#131920" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="394" y="302" width="388" height="60" rx="30" fill="url(#bar-green)"/>
  </g>

  <!-- Row 2: Demain -->
  <g>
    <circle cx="304" cy="512" r="58" fill="url(#badge-yellow)"/>
    <path d="M277 514 L296 533 L334 493" fill="none" stroke="#131920" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="394" y="482" width="328" height="60" rx="30" fill="url(#bar-yellow)"/>
  </g>

  <!-- Row 3: Un jour -->
  <g>
    <circle cx="304" cy="692" r="58" fill="url(#badge-coral)"/>
    <path d="M277 694 L296 713 L334 673" fill="none" stroke="#131920" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="394" y="662" width="268" height="60" rx="30" fill="url(#bar-coral)"/>
  </g>
</svg>
