<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Elevated white checklist card scaled safely inside Android 66dp/108dp safe circle -->
    <linearGradient id="card-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F9FD"/>
    </linearGradient>
    <filter id="card-shadow" x="-18%" y="-14%" width="136%" height="138%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A4E82" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A4E82" flood-opacity="0.16"/>
    </filter>

    <linearGradient id="badge-green" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#5CE286"/>
      <stop offset="100%" stop-color="#2FC464"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6FE390"/>
      <stop offset="100%" stop-color="#86E9A2"/>
    </linearGradient>

    <linearGradient id="badge-yellow" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F0C946"/>
      <stop offset="100%" stop-color="#D49A1D"/>
    </linearGradient>
    <linearGradient id="bar-yellow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E6C554"/>
      <stop offset="100%" stop-color="#F0D679"/>
    </linearGradient>

    <linearGradient id="badge-coral" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F06A75"/>
      <stop offset="100%" stop-color="#D94250"/>
    </linearGradient>
    <linearGradient id="bar-coral" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E55B67"/>
      <stop offset="100%" stop-color="#F07B85"/>
    </linearGradient>
  </defs>

  <!-- Scaled 0.60 around center (512,512) for generous balanced blue margin inside Circle & Squircle masks -->
  <g transform="translate(512 512) scale(0.60) translate(-512 -512)">
    <g filter="url(#card-shadow)">
      <rect x="166" y="152" width="692" height="720" rx="126" fill="url(#card-grad)"/>
      <rect x="168" y="154" width="688" height="716" rx="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4"/>
    </g>

    <g>
      <circle cx="304" cy="332" r="58" fill="url(#badge-green)"/>
      <path d="M277 334 L296 353 L334 313" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="394" y="302" width="388" height="60" rx="30" fill="url(#bar-green)"/>
    </g>

    <g>
      <circle cx="304" cy="512" r="58" fill="url(#badge-yellow)"/>
      <path d="M277 514 L296 533 L334 493" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="394" y="482" width="328" height="60" rx="30" fill="url(#bar-yellow)"/>
    </g>

    <g>
      <circle cx="304" cy="692" r="58" fill="url(#badge-coral)"/>
      <path d="M277 694 L296 713 L334 673" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="394" y="662" width="268" height="60" rx="30" fill="url(#bar-coral)"/>
    </g>
  </g>
</svg>
