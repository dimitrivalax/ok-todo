<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Apple iOS 18 Tinted icon: pure grayscale luminance values for system color tinting -->
    <linearGradient id="bg-tinted" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="card-tinted" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#363636"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg-tinted)"/>

  <!-- Subtle mid-gray card -->
  <rect x="166" y="152" width="692" height="720" rx="126" fill="url(#card-tinted)" stroke="#686868" stroke-width="4"/>

  <!-- High-contrast stepped luminance checklist rows -->
  <g>
    <circle cx="304" cy="332" r="58" fill="#FFFFFF"/>
    <path d="M277 334 L296 353 L334 313" fill="none" stroke="#181818" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="394" y="302" width="388" height="60" rx="30" fill="#F2F2F2"/>
  </g>

  <g>
    <circle cx="304" cy="512" r="58" fill="#E0E0E0"/>
    <path d="M277 514 L296 533 L334 493" fill="none" stroke="#181818" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="394" y="482" width="328" height="60" rx="30" fill="#CCCCCC"/>
  </g>

  <g>
    <circle cx="304" cy="692" r="58" fill="#BFBFBF"/>
    <path d="M277 694 L296 713 L334 673" fill="none" stroke="#181818" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="394" y="662" width="268" height="60" rx="30" fill="#A8A8A8"/>
  </g>
</svg>
